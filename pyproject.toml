[project]
name = "dev-english"
version = "0.1.0"
description = "Local voice app to practice spoken English for international tech interviews"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "python-multipart>=0.0.12",
    "faster-whisper>=1.1",
    "kokoro-onnx>=0.4",
    "soundfile>=0.12",
    "numpy",
    "nvidia-cublas-cu12; sys_platform == 'win32' or sys_platform == 'linux'",
    "nvidia-cudnn-cu12>=9,<10; sys_platform == 'win32' or sys_platform == 'linux'",
]

[tool.uv]
package = false
required-environments = ["sys_platform == 'win32' and platform_machine == 'AMD64'"]
