<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>english-hub</title>
  <link rel="icon" href="/static/icon.svg">
  <link rel="preload" href="/static/fonts/figtree-latin.woff2" as="font" type="font/woff2" crossorigin>
  <script>
    // Theme before first paint: "light" | "dark" | "system" (default, follows the OS).
    try { const t = JSON.parse(localStorage.getItem("de.theme")); if (t === "light" || t === "dark") document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header class="top">
  <a class="brand" href="#home" aria-label="english-hub, início"><span class="mark" aria-hidden="true"></span>english-hub</a>
  <nav id="nav" aria-label="Principal"></nav>
  <div class="steps" id="steps" role="group" aria-label="Etapas da configuração"></div>
  <div class="top-end">
    <a id="status" class="status" href="#settings" role="status">carregando…</a>
    <a class="icon-btn" href="#settings" id="settings-link" title="Configurações" aria-label="Configurações"></a>
  </div>
</header>
<main id="view">
  <!-- Boot screen: painted before any script or API call, replaced by the first view. -->
  <section class="boot" role="status" aria-live="polite">
    <div class="hood boot-hood">
      <div class="strip lg busy" style="--n:12" aria-hidden="true"><i style="--i:0"></i><i style="--i:1"></i><i style="--i:2"></i><i style="--i:3"></i><i style="--i:4"></i><i style="--i:5"></i><i style="--i:6"></i><i style="--i:7"></i><i style="--i:8"></i><i style="--i:9"></i><i style="--i:10"></i><i style="--i:11"></i></div>
    </div>
    <p class="boot-title">Ligando o english-hub…</p>
    <p class="boot-step" id="boot-step">Abrindo a linha com o servidor local</p>
  </section>
</main>
<div id="toast" class="toast hidden" role="status" aria-live="polite"></div>
<script src="/static/app.js"></script>
</body>
</html>
